<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priority Task Board</title>

    <!-- Style Link -->
    <link rel="stylesheet" href="style/taskboard.css" />

    <!-- Global font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Priority Task Board</h1>

      <div class="task-input-container">
        <div class="task-input-name-container">
          <p class="task-input-name-header">Task name</p>
          <input
            type="text"
            name="task-input-name"
            class="task-input-name"
            placeholder="Enter task name..."
          />
        </div>

        <div class="task-input-priority-container">
          <p class="task-input-priority-header">Priority</p>
          <select name="task-input-priority" class="task-input-priority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="task-input-description-container">
          <p class="task-input-description-header">Description</p>
          <input
            type="text"
            name="task-input-description"
            class="task-input-description"
            placeholder="Enter task description..."
          />
        </div>

        <div class="task-input-add-button-container">
          <p>
            <button class="task-input-add-button">Add Task</button>
          </p>
        </div>
      </div>

      <div class="task-filter-container">
        <p class="task-filter-heading">Filter by Priority</p>
        <select name="task-filter" class="task-filter">
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
          <option value="All">All</option>
        </select>
      </div>
    </header>

    <main>
      <div class="task-container">
        <section class="high-priority">
          <h3 class="high-priority-task-header">High Priority</h3>
          <div class="high-priority-task-container">
            <div class="high-priority-task">
              <div class="grid-1">
                <p class="high-priority-task-name">Make $10k</p>
                <p class="high-priority-task-description">I don't even know</p>
              </div>

              <div class="grid-2">
                <button class="high-priority-task-delete-button">Delete</button>
              </div>
            </div>

            <div class="high-priority-task">
              <div class="grid-1">
                <p class="high-priority-task-name">Make $200k</p>
                <p class="high-priority-task-description">
                  I don't even know yett
                </p>
              </div>

              <div class="grid-2">
                <button class="high-priority-task-delete-button">Delete</button>
              </div>
            </div>
          </div>
        </section>

        <section class="medium-priority">
          <h3 class="medium-priority-task-header">Medium Priority</h3>
          <div class="medium-priority-task-container">
            <div class="medium-priority-task">
              <div class="grid-1">
                <p class="medium-priority-task-name">Make $10k</p>
                <p class="medium-priority-task-description">
                  I don't even know
                </p>
              </div>

              <div class="grid-2">
                <button class="medium-priority-task-delete-button">
                  Delete
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="low-priority">
          <h3 class="low-priority-task-header">Low Priority</h3>
          <div class="low-priority-task-container">
            <div class="low-priority-task">
              <div class="grid-1">
                <p class="low-priority-task-name">Make $10k</p>
                <p class="low-priority-task-description">I don't even know</p>
              </div>

              <div class="grid-2">
                <button class="low-priority-task-delete-button">Delete</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>

  <script></script>
</html>
